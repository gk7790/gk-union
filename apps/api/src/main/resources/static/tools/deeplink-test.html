<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title}</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d8dee6;
      --primary: #155eef;
      --primary-hover: #0f49bd;
      --soft: #eef4ff;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(680px, calc(100% - 28px));
      margin: 24px auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.07);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.3;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 112px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      font: inherit;
      resize: vertical;
      outline: none;
      word-break: break-all;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(21, 94, 239, 0.12);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 0 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: var(--primary);
      color: #fff;
    }

    .primary:hover {
      background: var(--primary-hover);
    }

    .secondary {
      background: var(--soft);
      color: var(--primary);
    }

    .secondary:hover {
      background: #dbe8ff;
    }

    .status,
    .device {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: #fbfcfd;
      color: var(--muted);
      line-height: 1.55;
      word-break: break-word;
    }

    .status strong,
    .device strong {
      color: var(--text);
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 560px) {
      main {
        width: calc(100% - 20px);
        margin: 10px auto;
      }

      .panel {
        padding: 16px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>${title}</h1>
    <p>${description}</p>

    <label for="deeplink">${deeplinkLabel}</label>
    <textarea id="deeplink" placeholder="${deeplinkPlaceholder}" data-value="${deeplink}" spellcheck="false"></textarea>

    <div class="actions">
      <button id="launch" class="primary" type="button">拉起 App</button>
      <button id="copy" class="secondary" type="button">复制链接</button>
      <button id="clear" class="secondary" type="button">清空</button>
    </div>

    <div id="status" class="status"></div>
    <div id="device" class="device"></div>
  </section>
</main>

<script>
  const deeplinkInput = document.getElementById("deeplink");
  const statusBox = document.getElementById("status");
  const deviceBox = document.getElementById("device");

  function setStatus(html) {
    statusBox.innerHTML = html;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function deeplinkValue() {
    return deeplinkInput.value.trim();
  }

  function prefillFromDataValue() {
    const value = deeplinkInput.dataset.value || "";
    if (value && !isTemplatePlaceholder(value) && !deeplinkValue()) {
      deeplinkInput.value = value;
    }
  }

  function isTemplatePlaceholder(value) {
    return /^\$\{[A-Za-z0-9_]+}$/.test(value.trim());
  }

  function prefillFromQuery() {
    const params = new URLSearchParams(window.location.search);
    const value = params.get("deeplink") || params.get("url");
    if (value && !deeplinkValue()) {
      deeplinkInput.value = value;
      setStatus("<strong>已从 URL 参数填入 Deeplink：</strong><br>" + escapeHtml(value));
      return true;
    }
    return false;
  }

  function renderInitialStatus() {
    const target = deeplinkValue();
    if (target) {
      setStatus("<strong>已自动填入 Deeplink：</strong><br>" + escapeHtml(target));
      return;
    }
    setStatus('<span class="error">未提供 Deeplink，请粘贴三方返回的 Deeplink 后再点击拉起 App。</span>');
  }

  function launchApp() {
    const target = deeplinkValue();
    if (!target) {
      setStatus('<span class="error">请先粘贴 Deeplink。</span>');
      return;
    }

    setStatus("<strong>正在尝试拉起：</strong><br>" + escapeHtml(target));

    const link = document.createElement("a");
    link.href = target;
    link.rel = "noreferrer";
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  async function copyLink() {
    const target = deeplinkValue();
    if (!target) {
      setStatus('<span class="error">没有可复制的 Deeplink。</span>');
      return;
    }

    try {
      await navigator.clipboard.writeText(target);
      setStatus("<strong>已复制 Deeplink：</strong><br>" + escapeHtml(target));
    } catch (error) {
      deeplinkInput.select();
      setStatus('<span class="error">自动复制失败，请手动复制输入框内容。</span>');
    }
  }

  function renderDeviceInfo() {
    const info = [
      ["User Agent", navigator.userAgent],
      ["Platform", navigator.platform || "unknown"],
      ["Language", navigator.language || "unknown"],
      ["Viewport", window.innerWidth + " x " + window.innerHeight],
      ["Visibility", document.visibilityState]
    ];

    deviceBox.innerHTML = "<strong>设备信息</strong><br>" + info
      .map(([label, value]) => label + ": " + escapeHtml(value))
      .join("<br>");
  }

  document.getElementById("launch").addEventListener("click", launchApp);
  document.getElementById("copy").addEventListener("click", copyLink);
  document.getElementById("clear").addEventListener("click", () => {
    deeplinkInput.value = "";
    setStatus("已清空，请粘贴新的 Deeplink。");
    deeplinkInput.focus();
  });

  document.addEventListener("visibilitychange", renderDeviceInfo);
  window.addEventListener("resize", renderDeviceInfo);

  prefillFromDataValue();
  if (!prefillFromQuery()) {
    renderInitialStatus();
  }
  renderDeviceInfo();
</script>
</body>
</html>
